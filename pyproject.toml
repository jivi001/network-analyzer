[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-sentinel"
version = "1.0.0"
description = "Network Traffic Analyzer & Security TUI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0",
    "python-nmap>=0.7.1",
    "ipwhois>=1.2.0",
    "pyyaml>=6.0",
]

[project.scripts]
sentinel = "sentinel:main"
sentinal = "sentinel:main"

[tool.setuptools]
py-modules = ["sentinel"]
packages = ["core", "detection", "network", "storage", "tui", "utils"]
